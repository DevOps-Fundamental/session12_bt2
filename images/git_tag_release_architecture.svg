<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="pkgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="950" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">QUY TRÌNH TỰ ĐỘNG HÓA PHÁT HÀNH DOCKER IMAGE KHI GẮN GIT TAG</text>
  <text x="500" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">git tag v1.0.0 • on.push.tags • docker/metadata-action@v5 • docker/build-push-action@v5 • GitHub Packages</text>

  <!-- Step 1: Git Tag Creation -->
  <g transform="translate(35, 105)">
    <rect width="210" height="380" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="40" rx="12" fill="url(#tagGrad)"/>
    <text x="105" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. GÁN NHÃN GIT TAG</text>

    <g transform="translate(12, 55)">
      <rect width="186" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="93" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Lệnh thực thi Local</text>
      <text x="12" y="45" font-family="monospace" font-size="9" fill="#fef08a">git tag v1.0.0</text>
      <text x="12" y="65" font-family="monospace" font-size="8.5" fill="#fef08a">git push origin v1.0.0</text>
    </g>

    <g transform="translate(12, 155)">
      <rect width="186" height="195" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="93" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Bộ lọc kích hoạt</text>
      <text x="12" y="46" font-family="monospace" font-size="8.5" fill="#38bdf8">.github/workflows/</text>
      <text x="12" y="62" font-family="monospace" font-size="8.5" fill="#38bdf8">release.yml</text>
      <line x1="12" y1="74" x2="174" y2="74" stroke="#334155"/>
      <text x="12" y="94" font-family="monospace" font-size="8.5" fill="#cbd5e1">on:</text>
      <text x="12" y="110" font-family="monospace" font-size="8.5" fill="#cbd5e1">  push:</text>
      <text x="12" y="126" font-family="monospace" font-size="8.5" fill="#cbd5e1">    tags:</text>
      <text x="24" y="142" font-family="monospace" font-size="8.5" fill="#fef08a">['v.so.so']</text>
      <text x="93" y="168" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Chỉ chạy khi có Git Tag</text>
      <text x="93" y="184" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Bỏ qua các commit thường</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 245 285 L 275 285" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="275,280 285,285 275,290" fill="#f59e0b"/>

  <!-- Step 2: Metadata Extraction -->
  <g transform="translate(275, 105)">
    <rect width="215" height="380" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="215" height="40" rx="12" fill="url(#metaGrad)"/>
    <text x="107" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. TRÍCH XUẤT METADATA</text>

    <g transform="translate(12, 55)">
      <rect width="191" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="95" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">Metadata Action</text>
      <text x="95" y="44" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">docker/metadata-</text>
      <text x="95" y="58" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">action@v5</text>
      <text x="95" y="74" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Tự động bóc tách SemVer</text>
    </g>

    <g transform="translate(12, 155)">
      <rect width="191" height="195" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="95" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">Các Tag Docker Tạo Ra</text>
      
      <rect x="10" y="36" width="171" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="56" font-family="monospace" font-size="9" fill="#fef08a">:v1.0.0 (chính xác)</text>

      <rect x="10" y="76" width="171" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="96" font-family="monospace" font-size="9" fill="#fef08a">:1.0 (nhánh minor)</text>

      <rect x="10" y="116" width="171" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="136" font-family="monospace" font-size="9" fill="#6ee7b7">:latest (bản mới nhất)</text>

      <text x="95" y="172" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Đồng bộ nhãn OCI labels</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 490 285 L 520 285" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="520,280 530,285 520,290" fill="#8b5cf6"/>

  <!-- Step 3: Build & Push Action -->
  <g transform="translate(520, 105)">
    <rect width="215" height="380" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="215" height="40" rx="12" fill="url(#pipeGrad)"/>
    <text x="107" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. BUILD &amp; PUSH ACTION</text>

    <g transform="translate(12, 55)">
      <rect width="191" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="95" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Build-Push Action</text>
      <text x="95" y="44" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">docker/build-push-</text>
      <text x="95" y="58" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">action@v5</text>
      <text x="95" y="74" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Tích hợp Docker Buildx</text>
    </g>

    <g transform="translate(12, 155)">
      <rect width="191" height="195" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="95" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Cấu hình Đẩy Ảnh</text>
      
      <text x="12" y="46" font-family="monospace" font-size="8.5" fill="#cbd5e1">context: .</text>
      <text x="12" y="66" font-family="monospace" font-size="8.5" fill="#6ee7b7">push: true</text>
      <text x="12" y="86" font-family="monospace" font-size="8" fill="#fef08a">tags: steps.meta</text>
      <text x="12" y="106" font-family="monospace" font-size="8" fill="#fef08a">labels: steps.meta</text>
      
      <line x1="12" y1="122" x2="179" y2="122" stroke="#334155"/>
      <text x="95" y="146" font-family="sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Đăng nhập bằng GHCR</text>
      <text x="95" y="164" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Tải lên an toàn bảo mật</text>
      <text x="95" y="180" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Layer Caching tự động</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 735 285 L 765 285" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="765,280 775,285 765,290" fill="#0284c7"/>

  <!-- Step 4: GitHub Packages Delivery -->
  <g transform="translate(765, 105)">
    <rect width="200" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="200" height="40" rx="12" fill="url(#pkgGrad)"/>
    <text x="100" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. GITHUB PACKAGES</text>

    <!-- Published Package Card -->
    <g transform="translate(12, 55)">
      <rect width="176" height="135" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
      <rect x="12" y="15" width="34" height="34" rx="6" fill="#10b981"/>
      <text x="29" y="38" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">IMG</text>
      
      <text x="54" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">release-app</text>
      <text x="54" y="42" font-family="monospace" font-size="9" fill="#fef08a">Tag: v1.0.0</text>

      <line x1="12" y1="58" x2="164" y2="58" stroke="#059669"/>
      <text x="88" y="78" font-family="sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Dung lượng: 18.5 MB</text>
      <text x="88" y="96" font-family="sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Hệ điều hành: linux/amd64</text>
      
      <rect x="15" y="106" width="146" height="20" rx="4" fill="#10b981"/>
      <text x="88" y="120" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">PUBLISHED ON GHCR</text>
    </g>

    <g transform="translate(12, 205)">
      <rect width="176" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="88" y="22" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Lệnh kéo ảnh Production</text>
      <text x="12" y="46" font-family="monospace" font-size="7.5" fill="#93c5fd">docker pull ghcr.io/</text>
      <text x="12" y="60" font-family="monospace" font-size="7.5" fill="#93c5fd">user/app:v1.0.0</text>
      
      <line x1="12" y1="74" x2="164" y2="74" stroke="#334155"/>
      <text x="88" y="96" font-family="sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Sẵn sàng triển khai</text>
      <text x="88" y="114" font-family="sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">trên Docker / K8s</text>
      <text x="88" y="132" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Continuous Delivery</text>
    </g>
  </g>

  <!-- Bottom workflow summary -->
  <g transform="translate(35, 505)">
    <rect width="930" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Ý NGHĨA KỸ THUẬT CỦA QUY TRÌNH PHÁT HÀNH THEO GIT TAG:</text>
    <text x="30" y="50" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Đảm bảo tính bất biến của bản phát hành: Mỗi thẻ Git Tag tương ứng duy nhất với một ảnh Docker có định danh cố định.</text>
    <text x="30" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Loại bỏ hoàn toàn thao tác build và push thủ công từ máy cá nhân, nâng cao tính bảo mật và tự động hóa trong DevOps.</text>
  </g>
</svg>
